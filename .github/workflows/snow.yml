name: Snow tracker

on:
  schedule:
    - cron: '43 5 * * *' # 06:43 Paris in winter (UTC+1), 07:43 in summer
  workflow_dispatch:
    inputs:
      force_send:
        description: Send the alert even if no resort is GO (to test notifications)
        type: boolean
        default: false

permissions:
  contents: write # to commit data/history.csv

concurrency:
  group: snow-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_SMTP: ${{ secrets.SMTP_PASSWORD != '' }}
      HAS_NTFY: ${{ secrets.NTFY_TOPIC != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the snow
        id: snow
        run: node snow.js
        env:
          FORCE_SEND: ${{ inputs.force_send || 'false' }}

      - name: Email alert
        if: steps.snow.outputs.send == 'true' && env.HAS_SMTP == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Snow Tracker <${{ secrets.SMTP_USERNAME }}>
          to: ${{ secrets.MAIL_TO || secrets.SMTP_USERNAME }}
          subject: ${{ steps.snow.outputs.subject }}
          html_body: file://email.html

      - name: Phone push (ntfy)
        if: steps.snow.outputs.send == 'true' && env.HAS_NTFY == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SUBJECT: ${{ steps.snow.outputs.subject }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sSf -H "Title: Snow tracker" -H "Tags: snowflake" -H "Click: $RUN_URL" \
            -d "$SUBJECT" "https://ntfy.sh/$NTFY_TOPIC"

      - name: Save history
        # Daily commit also keeps the repo "active" so GitHub doesn't pause the schedule.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv
          git diff --cached --quiet || git commit -m "snow: $(date -u +%F)"
          git push
